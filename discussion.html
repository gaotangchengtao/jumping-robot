ding-bottom:50px;margin-bottom:50px}.overview .navigation{display:none}.present .top,.present aside{display:none}.present .shell{display:block;max-width:1400px}.present main{padding-top:42px}.present .topic{max-width:1120px}.present h1{font-size:44px}.present .lead,.present .content{font-size:24px}.present .core p{font-size:30px}.present .note-heading,.present textarea,.present .status-row{display:none}.present .core{margin:32px 0}.present .navigation{margin-top:40px}.storage-warning{color:var(--red)}

<body>
<header class="top"><div class="brand" id="brand"></div><div class="actions"><a href="index.html">首页</a><a href="presentation.html">演示稿</a><button id="language">English</button><button id="overview"></button><button id="present"></button><button id="export"></button><button id="print"></button></div></header>
<div class="shell"><aside id="sidebar" aria-label="议题导航"></aside><main id="main"></main></div>
<script>
const topics=[
{id:'opening',zh:{title:'先从一个共同问题开始',nav:'讨论起点',lead:'围绕整个机器人讨论，把装载、储能、释放和落地连起来考虑。创新可以来自普通机构之间更巧妙的配合，也可以来自更好的操作体验。',question:'在每次操作都小于20 N的前提下，怎样把手的输入变成一次可重复、可瞄准的跳跃？',paragraphs:['先让每个人画一张简图，再比较四件事。暂时不急着决定用哪一种弹簧。'],options:['操作顺序','储能位置','释放方式','落地接触点']},en:{title:'A shared design question',nav:'Starting point',lead:'Discuss the complete robot: how loading, energy storage, release and landing work together. A useful difference may come from combining familiar mechanisms or making the robot easier to use.',question:'With each loading action below 20 N, how can hand input produce a repeatable jump in the intended direction?',paragraphs:['Ask everyone to sketch an idea, then compare four things before choosing a spring.'],options:['Operating sequence','Energy storage','Release mechanism','Landing contact']}},
{id:'loading',zh:{title:'让装载方式决定整机布局',nav:'怎样装载',lead:'同样是储存弹性能量，可以一次按下、展开长杠杆，也可以分几次转动手柄。',question:'5岁儿童更容易完成一次长按，还是几次短转？这会怎样改变整机布局？',paragraphs:['分次操作有机会降低每次用力，但会增加总行程和操作步骤。杠杆也需要用更长的手部行程换取较小的力。','可以从手的动作往回设计：手握在哪里、向哪个方向用力、装到一半松手时会怎样。'],options:['一次按压','折叠长杠杆','分次手摇']},en:{title:'Let the loading action shape the robot',nav:'Loading action',lead:'Elastic energy could be stored with one push, a folding lever, or several turns of a handle.',question:'Would a five-year-old find one long push easier than several short turns? How would that choice change the layout?',paragraphs:['Repeated strokes may reduce the force per action, at the cost of more total travel and more steps. A lever also trades force for travel.','Design backwards from the hand: where it grips, which way it moves, and what happens if the user lets go halfway.'],options:['Single push','Folding lever','Repeated winding']}},
{id:'settings',zh:{title:'把“跳多远”和“往哪跳”分别调节',nav:'距离与方向',lead:'用机械挡位控制预紧量，用另一个固定位置控制脚部或推力方向。目标是调方向时，尽量不改变储能。',question:'能不能换一个挡位，就重复得到相近的跳跃，而不是每次凭感觉装载？',paragraphs:['可以讨论限位孔、挡块或有明确刻度的上弦位置。方向调节则通过锁定脚部角度或导向结构来实现。','先固定一个设置，只改变另一个，检查这两项调节是否真的足够独立。'],options:['预紧限位','固定角度','重复性测试']},en:{title:'Adjust range and direction separately',nav:'Range and direction',lead:'Use a mechanical stop for spring preload and a separate locked position for the foot or push-off axis. Aim to change direction with as little change in stored energy as possible.',question:'Could an indexed setting give similar jumps repeatedly, instead of asking the user to load by feel?',paragraphs:['Consider locating holes, stop blocks, or marked winding positions. Set direction with a locked foot angle or guide.','Hold one setting fixed while changing the other. Test whether the two adjustments are independent enough to be useful.'],options:['Preload stop','Locked angle','Repeatability test']}},
{id:'handle',zh:{title:'让装载手柄同时承担别的工作',nav:'一个零件多种作用',lead:'长手柄展开时提供省力作用，收回后可以覆盖活动连杆，或者成为提拿位置。',question:'一个零件能否同时完成装载、保护和携带？',paragraphs:['先画出手柄展开与收回的两个位置，看看它会不会挡住扳机、碰到连杆，或让孩子的手靠近夹点。','检查15 × 15 × 10 cm的尺寸要求是否也适用于展开状态。多功能应当减少整机复杂度，而不是增加操作负担。'],options:['装载杠杆','活动保护盖','提拿位置']},en:{title:'Give the loading handle another job',nav:'Parts with two jobs',lead:'An extended handle could provide leverage. Folded back, it might cover the moving links or become a carrying grip.',question:'Could one part help with loading, protection and carrying?',paragraphs:['Sketch both positions. Check whether the handle blocks the trigger, collides with a link, or brings fingers near a pinch point.','Confirm whether the 15 × 15 × 10 cm limit also applies with the handle open. Combining functions should simplify the complete robot.'],options:['Loading lever','Moving guard','Carrying grip']}},
{id:'state',zh:{title:'用机械结构显示装载状态',nav:'装载状态',lead:'把小旗、滑块或颜色窗口直接连接到锁扣。只有锁扣真正扣住，才显示“已装载”。',question:'孩子能否一眼区分未装载、半装载和可以触发？装到一半松手会发生什么？',paragraphs:['状态显示不需要电池。关键是它应反映锁扣是否实际扣住，而不只是手柄转过了多少。','同时考虑如何退出半装载状态，避免让使用者猜测下一步该怎么做。'],options:['机械小旗','滑动窗口','锁扣反馈']},en:{title:'Make the loaded state visible',nav:'Loaded-state feedback',lead:'Connect a flag, slider or colour window directly to the catch. It should indicate “loaded” only when the catch has actually engaged.',question:'Can a child distinguish unloaded, partly loaded and ready to trigger? What happens if they stop halfway?',paragraphs:['Mechanical feedback needs no battery. It should reflect the catch state, rather than merely how far the handle has moved.','Also consider how to leave a partly loaded state without making the user guess what to do next.'],options:['Mechanical flag','Sliding window','Catch feedback']}},
{id:'legs',zh:{title:'把左右腿当成一个系统',nav:'双腿同步',lead:'两条腿各用一个弹簧，调节灵活，但可能不同步。共同轴或连接杆可以约束动作，也可能增加重量和摩擦。',question:'影响方向稳定性的关键，是两个弹簧一样强，还是两条腿必须同时动作？',paragraphs:['比较两种路线：一个储能元件驱动两条腿，或者每条腿独立储能、再通过结构协调。','观察起跳时的左右偏转和机身旋转，才能判断同步结构是否值得保留。'],options:['共用储能','独立储能','共同轴或连接杆']},en:{title:'Treat both legs as one system',nav:'Leg coordination',lead:'Separate springs offer adjustment but may release unevenly. A shared shaft or link constrains the motion, while adding mass and friction.',question:'Does directional consistency depend more on matching spring force or on making both legs move together?',paragraphs:['Compare one energy store driving both legs with separate stores coordinated by a mechanical connection.','Observe sideways deviation and body rotation at take-off before deciding whether the coupling is worth keeping.'],options:['Shared energy store','Separate energy stores','Shared shaft or link']}},
{id:'landing',zh:{title:'把起跳和落地的承力位置分开',nav:'落地保护',lead:'起跳需要稳定传力，落地又希望缓冲。可以考虑硬的承力脚配软护圈，让连杆、轴和锁扣尽量避开直接撞击。',question:'机器人落地时，应该先让哪个部位接触地面？这个部位能否更换？',paragraphs:['把可能的落地姿态画出来：脚先落地、侧面着地、机身翻转。检查每种姿态的力会传到哪里。','保护结构还要兼顾质量和地板保护，不能只把外壳不断加厚。'],options:['承力脚','软护圈','可更换接触件']},en:{title:'Separate push-off and landing load paths',nav:'Landing protection',lead:'Push-off needs firm force transmission; landing benefits from cushioning. Rigid feet and a soft outer ring could keep direct impacts away from links, shafts and the catch.',question:'Which part should touch the floor first during landing? Could that contact part be replaced?',paragraphs:['Sketch feet-first, sideways and overturned landings. Trace where the impact load goes in each case.','Balance protection with mass and floor marking, rather than simply making the shell thicker.'],options:['Load-bearing feet','Soft outer ring','Replaceable contact parts']}},
{id:'play',zh:{title:'让玩法指导设计选择',nav:'玩法差异化',lead:'对儿童来说，连续三次落进目标区、用同一挡位预测落点，也可以成为有意思的玩法。它们会推动设计关注重复性。',question:'我们希望孩子体验的是力量、瞄准，还是探索机械规律？',paragraphs:['如果玩法是落入目标区，方向和距离的一致性就重要；如果玩法是比较不同设置，就需要清楚、可重复的机械挡位。','先选一个简单玩法，再判断它需要哪些机构和反馈，避免把功能全部堆上去。'],options:['目标区挑战','挡位与落点','机械规律探索']},en:{title:'Let the play experience guide the design',nav:'Play experience',lead:'Landing in a target area three times, or predicting the landing point from a setting, could make repeatability part of the play experience.',question:'Should the child experience power, aiming, or discovering mechanical relationships?',paragraphs:['A target game calls for consistent distance and direction. A game about settings needs clear, repeatable mechanical adjustments.','Choose a simple play experience first, then decide which mechanisms and feedback it needs.'],options:['Target challenge','Settings and landing points','Mechanical discovery']}},
{id:'cage',zh:{title:'外壳能否同时成为弹性元件？',nav:'大胆的另一条路线',lead:'让柔性外框储能，同时围住内部机构，承担一部分落地保护作用。',question:'它会减少零件，还是把难题转移到材料和方向控制上？',paragraphs:['这条路线值得与传统“刚性机身＋独立弹簧”比较。讨论重点是整机是否更简单，而不是外形是否更新奇。','需要验证材料疲劳、变形一致性、落地反弹和起跳方向。把它作为另一条原型路线，而不是预先认定它更好。'],options:['柔性外框','储能与保护结合','低能量原型比较']},en:{title:'Could the shell also store energy?',nav:'A bolder alternative',lead:'A flexible frame could store elastic energy while surrounding the mechanism and providing some landing protection.',question:'Would it remove parts, or move the difficulty into material behaviour and direction control?',paragraphs:['Compare it with a rigid body and separate spring. The useful question is whether the complete robot becomes simpler.','Test fatigue, consistency of deformation, landing rebound and launch direction. Treat it as an alternative prototype route, not an assumed improvement.'],options:['Flexible frame','Storage and protection','Low-energy prototype comparison']}},
{id:'decisions',zh:{title:'把讨论收敛成三个决定',nav:'讨论后的决定',lead:'先保留两条真正不同的方案，再用简单原型消除最重要的不确定性。',question:'什么测试结果，会让我们保留或放弃一个方案？',paragraphs:['比较方案时，回到操作顺序、储能位置、释放方式和落地接触点。不要只比较外形。'],decisions:['选哪两条路线做原型？','每条路线最先验证什么？','谁负责，下一次带回什么证据？']},en:{title:'Leave with three decisions',nav:'Decisions',lead:'Keep two meaningfully different approaches, then use simple prototypes to resolve the most important uncertainties.',question:'What test result would make us keep or reject a concept?',paragraphs:['Compare the operating sequence, energy store, release and landing contacts, rather than only the appearance.'],decisions:['Which two approaches will we prototype?','What will we test first for each one?','Who will bring back which evidence?']}}
];
const ui={zh:{brand:'Jumping Robot',overview:'全部议题',single:'逐项查看',present:'展示模式',export:'导出记录',print:'打印 / PDF',question:'带到小组里的问题',notes:'组员想法与现场记录',placeholder:'记录新的组合、分歧、草图要点或准备做的测试……',saved:'已保存在本机',unsaved:'本机保存不可用，请导出记录',previous:'上一项',next:'下一项',statuses:['未决定','保留比较','优先验证'],intro:'讨论起点',topic:'讨论切入点',last:'收敛讨论'},en:{brand:'Jumping Robot',overview:'All topics',single:'One at a time',present:'Present',export:'Export notes',print:'Print / PDF',question:'Question for the group',notes:'Group ideas and meeting notes',placeholder:'Record combinations, disagreements, sketch ideas or a test to try…',saved:'Saved on this device',unsaved:'Local saving unavailable: export your notes',previous:'Previous',next:'Next',statuses:['Open','Keep for comparison','Test first'],intro:'Starting point',topic:'Discussion topic',last:'Decisions'}};
let lang='zh',current=0,overview=false,storage=true,state={};
try{state=JSON.parse(localStorage.getItem('jumpingRobotBrainstorm')||'{}');lang=state.language||'zh'}catch(e){storage=false}
if(!ui[lang])lang='zh';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){state.language=lang;try{localStorage.setItem('jumpingRobotBrainstorm',JSON.stringify(state));storage=true}catch(e){storage=false}document.querySelectorAll('.save-status').forEach(e=>{e.textContent=storage?ui[lang].saved:ui[lang].unsaved;e.classList.toggle('storage-warning',!storage)})}
function render(){const u=ui[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelector('#brand').textContent=u.brand;document.querySelector('#language').textContent=lang==='zh'?'English':'中文';for(const k of ['present','export','print'])document.querySelector('#'+k).textContent=u[k];document.querySelector('#overview').textContent=overview?u.single:u.overview;
document.querySelector('#sidebar').innerHTML=topics.map((t,i)=>`<button class="nav-item ${i===current?'active':''}" data-nav="${i}"><span class="number">${String(i).padStart(2,'0')}</span><span>${esc(t[lang].nav)}</span><span class="nav-dot ${state[t.id]?.note?'saved':''}"></span></button>`).join('');
document.querySelector('#main').innerHTML=topics.map((t,i)=>{const c=t[lang],record=state[t.id]||{};return `<section class="topic ${i===current?'active':''}" data-topic="${t.id}"><div class="eyebrow">${i===0?u.intro:i===topics.length-1?u.last:u.topic+' '+i}</div><h1>${esc(c.title)}</h1><p class="lead">${esc(c.lead)}</p><div class="core"><div class="core-label">${u.question}</div><p>${esc(c.question)}</p></div><div class="content">${c.paragraphs.map(p=>'<p>'+esc(p)+'</p>').join('')}</div>${c.options?'<div class="options">'+c.options.map(v=>'<span class="option">'+esc(v)+'</span>').join('')+'</div>':''}${c.decisions?'<ol class="decision-list">'+c.decisions.map((v,j)=>`<li><strong>0${j+1}</strong>${esc(v)}</li>`).join('')+'</ol>':''}<div class="note-heading"><h2>${u.notes}</h2><span class="save-status">${storage?u.saved:u.unsaved}</span></div><textarea data-note="${t.id}" aria-label="${u.notes}" placeholder="${u.placeholder}">${esc(record.note||'')}</textarea><div class="status-row">${u.statuses.map((label,j)=>`<button data-status="${j}" data-id="${t.id}" class="${(record.status||0)===j?'selected':''}">${label}</button>`).join('')}</div><div class="navigation"><button data-step="-1" ${i===0?'disabled':''}>${u.previous}</button><span class="page-count">${i+1} / ${topics.length}</span><button data-step="1" ${i===topics.length-1?'disabled':''}>${u.next}</button></div></section>`}).join('');
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(Number(b.dataset.nav)));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>show(current+Number(b.dataset.step)));document.querySelectorAll('[data-note]').forEach(e=>e.addEventListener('input',()=>{const id=e.dataset.note;state[id]=state[id]||{};state[id].note=e.value;save();const n=document.querySelector(`[data-nav="${topics.findIndex(t=>t.id===id)}"] .nav-dot`);n?.classList.toggle('saved',!!e.value)}));document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;state[id]=state[id]||{};state[id].status=Number(b.dataset.status);save();b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))});}
function show(i){current=Math.max(0,Math.min(topics.length-1,i));document.querySelectorAll('.topic').forEach((e,j)=>e.classList.toggle('active',j===current));document.querySelectorAll('.nav-item').forEach((e,j)=>e.classList.toggle('active',j===current));if(overview)document.querySelectorAll('.topic')[current].scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0});}
document.querySelector('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';save();render()};document.querySelector('#overview').onclick=()=>{overview=!overview;document.body.classList.toggle('overview',overview);render();window.scrollTo({top:0})};document.querySelector('#present').onclick=()=>{overview=false;document.body.classList.remove('overview');document.body.classList.add('present');render();show(current)};document.querySelector('#print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='Escape'){document.body.classList.remove('present');return}if(['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key)){e.preventDefault();show(e.key==='Home'?0:e.key==='End'?topics.length-1:current+(['ArrowLeft','PageUp'].includes(e.key)?-1:1))}});
document.querySelector('#export').onclick=()=>{let text='# '+ui[lang].brand+'\n\n';for(const t of topics){const c=t[lang],r=state[t.id]||{};text+='## '+c.title+'\n\n'+c.question+'\n\n'+ui[lang].statuses[r.status||0]+'\n\n'+(r.note||'')+'\n\n'}const blob=new Blob(['\uFEFF'+text],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jumping-robot-meeting-notes.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
render();
</script>
</body>
</html>
